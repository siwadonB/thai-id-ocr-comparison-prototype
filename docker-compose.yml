services:
  backend:
    build: ./backend
    container_name: thai-id-gemini-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
    command: npm run dev

  frontend:
    build: ./frontend
    container_name: thai-id-gemini-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0